<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10141c">
<title>NOCTURNE STUDIO 3D · Espacio de trabajo</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#191f2a;--line:#303b4d;--text:#edf2fa;--muted:#8996aa;--accent:#8ebaff;--orange:#f0a45e}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#202938;border-radius:7px;padding:8px 11px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#2b3b51;border-color:#526985}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:52px 1fr 28px}
header{display:flex;align-items:center;gap:18px;padding:0 16px;background:#151b25;border-bottom:1px solid var(--line);z-index:2}
.brand{font-weight:800;letter-spacing:.12em;font-size:12px;white-space:nowrap}.brand span{color:var(--accent)}
.header-sub{color:var(--muted);font-size:11px;border-left:1px solid var(--line);padding-left:17px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}.state{font-size:11px;color:#8bd8b1;display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#65d39b;box-shadow:0 0 9px #65d39b}
#workspace{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 45%,#202b3a 0%,#131a25 65%,#10141c 100%)}
#viewport{position:absolute;inset:0;touch-action:none}#viewport canvas{display:block;width:100%;height:100%;outline:none}
.toolbar{position:absolute;top:14px;left:14px;display:flex;gap:5px;padding:5px;background:#171e29eF;border:1px solid #354154;border-radius:10px;box-shadow:0 8px 26px #0005}
.toolbar button{min-width:34px;padding:7px 9px;font-size:12px}.toolbar .active{background:#304965;border-color:#6e9ed6}
.hint{position:absolute;left:16px;bottom:15px;padding:8px 11px;border-radius:8px;background:#151c27d9;border:1px solid #303b4d;color:#a9b5c7;font-size:11px;pointer-events:none}
.hint b{color:#e7eef9;font-weight:600}
.viewcube{position:absolute;right:20px;top:18px;width:116px;height:116px;perspective:450px;display:grid;place-items:center;pointer-events:none}
.cube{width:66px;height:66px;position:relative;transform-style:preserve-3d;transform:rotateX(-28deg) rotateY(35deg);transition:transform .25s;pointer-events:auto}
.face{position:absolute;width:66px;height:66px;display:grid;place-items:center;background:#283a50;border:1px solid #8db8e7;color:#dcecff;font-size:10px;font-weight:700;cursor:pointer;backface-visibility:visible;opacity:.96}
.face:hover{background:#45678e}.front{transform:translateZ(33px)}.back{transform:rotateY(180deg) translateZ(33px)}.right{transform:rotateY(90deg) translateZ(33px)}.left{transform:rotateY(-90deg) translateZ(33px)}.top{transform:rotateX(90deg) translateZ(33px)}.bottom{transform:rotateX(-90deg) translateZ(33px)}
.axis-legend{position:absolute;right:20px;bottom:18px;color:#7f8ca0;font-size:10px;display:flex;gap:10px;background:#151c27c9;padding:7px 9px;border:1px solid #303b4d;border-radius:7px}
.axis-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.x{background:#ed6b67}.y{background:#75c98b}.z{background:#6ba9fa}
footer{display:flex;align-items:center;padding:0 13px;background:#151b25;border-top:1px solid var(--line);color:#7f8ca0;font-size:10px;gap:16px}
footer span:last-child{margin-left:auto}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#10141c;color:#b9c9dd;z-index:5;font-size:13px}
@media(max-width:640px){header{height:48px;padding:0 10px;gap:9px}.header-sub{display:none}.brand{font-size:10px}.header-right .state{display:none}#app{grid-template-rows:48px 1fr 26px}.toolbar{top:10px;left:8px;gap:3px}.toolbar button{padding:7px 8px;font-size:11px}.viewcube{right:7px;top:70px;transform:scale(.82);transform-origin:top right}.hint{left:8px;bottom:10px;max-width:calc(100% - 16px);font-size:10px}.axis-legend{right:8px;bottom:10px;transform:translateY(-44px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
<header><div class="brand">NOCTURNE <span>STUDIO</span> 3D</div><div class="header-sub">ESPACIO DE TRABAJO · VISTA 3D</div><div class="header-right"><div class="state"><i class="dot"></i> MOTOR 3D ACTIVO</div><button id="homeBtn" title="Restablecer vista">Restablecer vista</button></div></header>
<main id="workspace">
<div id="viewport" aria-label="Visor tridimensional interactivo"></div>
<div id="loading">Inicializando espacio tridimensional…</div>
<nav class="toolbar" aria-label="Perspectivas">
<button data-view="front" title="Vista frontal">Frente</button><button data-view="back" title="Vista posterior">Atrás</button><button data-view="top" title="Vista superior">Arriba</button><button data-view="bottom" title="Vista inferior">Abajo</button><button data-view="left" title="Vista izquierda">Izq.</button><button data-view="right" title="Vista derecha">Der.</button><button data-view="iso" class="active" title="Vista isométrica">ISO</button>
</nav>
<div class="viewcube" aria-label="Cubo de orientación">
<div class="cube" id="orientationCube">
<button class="face front" data-view="front">FRENTE</button><button class="face back" data-view="back">ATRÁS</button><button class="face right" data-view="right">DERECHA</button><button class="face left" data-view="left">IZQUIERDA</button><button class="face top" data-view="top">ARRIBA</button><button class="face bottom" data-view="bottom">ABAJO</button>
</div></div>
<div class="hint"><b>Ratón:</b> orbitar · rueda: acercar/alejar · botón derecho: desplazar <span> · </span><b>Táctil:</b> un dedo orbita · dos dedos zoom/paneo</div>
<div class="axis-legend"><span><i class="x"></i>X</span><span><i class="y"></i>Y</span><span><i class="z"></i>Z</span></div>
</main>
<footer><span>ESCENA VACÍA · UNIDADES DE REFERENCIA</span><span>THREE.JS / WEBGL</span><span id="fps">ESPERANDO ESCENA</span></footer>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host=document.getElementById('viewport');
const loading=document.getElementById('loading');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x131a25);
const camera=new THREE.PerspectiveCamera(42,1,.1,2000);
camera.position.set(105,82,105);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.075;controls.rotateSpeed=.72;
controls.zoomSpeed=1;controls.panSpeed=.8;controls.minDistance=5;controls.maxDistance=650;
controls.target.set(0,0,0);controls.update();

scene.add(new THREE.HemisphereLight(0xdceaff,0x202938,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(90,140,100);scene.add(key);
const fill=new THREE.DirectionalLight(0x719bd0,.65);fill.position.set(-100,50,-80);scene.add(fill);

const grid=new THREE.GridHelper(200,100,0x53647b,0x29374a);grid.position.y=-.02;scene.add(grid);
const axes=new THREE.AxesHelper(65);scene.add(axes);
const origin=new THREE.Mesh(new THREE.SphereGeometry(.8,20,12),new THREE.MeshBasicMaterial({color:0xe5edf8}));
origin.position.set(0,0,0);scene.add(origin);
// A subtle, real 3D reference object gives depth without pretending to be a user model.
const reference=new THREE.Mesh(new THREE.BoxGeometry(18,18,18),new THREE.MeshStandardMaterial({color:0x719ac7,metalness:.18,roughness:.48,transparent:true,opacity:.13}));
reference.position.set(0,9,0);reference.visible=false;scene.add(reference);

const presets={
 iso:new THREE.Vector3(105,82,105),front:new THREE.Vector3(0,0,150),back:new THREE.Vector3(0,0,-150),
 top:new THREE.Vector3(0,150,.001),bottom:new THREE.Vector3(0,-150,.001),left:new THREE.Vector3(-150,0,0),right:new THREE.Vector3(150,0,0)
};
let cameraTween=null;
function setView(name){
 const p=presets[name];if(!p)return;
 // Avoid a camera-up vector parallel to the viewing direction in top/bottom views.
 camera.up=(name==='top'||name==='bottom')?new THREE.Vector3(0,0,-1):new THREE.Vector3(0,1,0);
 camera.updateProjectionMatrix();
 const distance=camera.position.distanceTo(controls.target);
 const dir=p.clone().normalize();
 cameraTween={from:camera.position.clone(),to:controls.target.clone().addScaledVector(dir,Math.max(85,Math.min(230,distance))),start:performance.now(),duration:420};
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('homeBtn').addEventListener('click',()=>{controls.target.set(0,0,0);setView('iso')});

const cube=document.getElementById('orientationCube');
function updateCube(){const d=camera.position.clone().sub(controls.target).normalize();const yaw=Math.atan2(d.x,d.z)*180/Math.PI;const pitch=Math.asin(d.y)*180/Math.PI;cube.style.transform='rotateX('+(-pitch)+'deg) rotateY('+yaw+'deg)';}
controls.addEventListener('change',updateCube);
let resizeObserver=new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);});
resizeObserver.observe(host);
let frames=0,lastFps=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 if(cameraTween){const t=Math.min(1,(now-cameraTween.start)/cameraTween.duration);const s=t*t*(3-2*t);camera.position.lerpVectors(cameraTween.from,cameraTween.to,s);if(t>=1)cameraTween=null;}
 controls.update();renderer.render(scene,camera);
 frames++;if(now-lastFps>1000){document.getElementById('fps').textContent=frames+' FPS aprox.';frames=0;lastFps=now;}
}
updateCube();loading.remove();requestAnimationFrame(animate);
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;const map={1:'front',2:'back',3:'right',4:'left',5:'top',6:'bottom',0:'iso'};if(map[e.key])setView(map[e.key]);});
</script>
</body></html>
