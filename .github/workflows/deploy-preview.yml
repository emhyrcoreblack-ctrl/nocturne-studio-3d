name: Deploy preview app to GitHub Pages

on:
  push:
    branches: [preview]
    paths:
      - 'preview/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
